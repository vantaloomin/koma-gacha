<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 40" width="136" height="40">
  <style>.w { fill: #1d1d1f } .j { fill: #8e8e93 } @media (prefers-color-scheme: dark) { .w { fill: #f5f5f7 } .j { fill: #a1a1a6 } }</style>
  <!-- Koma lockup: mark + wordmark (Inter 650; falls back to the system sans) -->
